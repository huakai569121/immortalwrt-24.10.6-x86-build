name: ImmortalWrt 24.10.6 x86_64 定制固件

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: '仅做编译前冲突预检（不下载源码包、不编译），产出 PREFLIGHT_REPORT.txt'
        type: boolean
        default: false
      turboacc_mode:
        description: 'Turbo ACC 注入方案；本次已确认默认 none（不内置）'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'chenmozhijin-no-sfe'
          - 'mufeng05'
      enable_quickstart:
        description: '内置 quickstart 向导（连带 iStore 商店依赖链）'
        type: boolean
        default: true
      prebuilt_clash_core:
        description: '预置 Clash Meta(mihomo) 内核，避免首次启动联网下载失败'
        type: boolean
        default: true
      rootfs_partsize_mib:
        description: 'rootfs 分区大小 MiB（overlay 净可用 = 该值 - squashfs 固件本体）'
        type: string
        default: '6144'
      lan_ip:
        description: '默认 LAN IP'
        type: string
        default: '192.168.2.1'
      source_ref:
        description: 'ImmortalWrt 底包 tag / 分支'
        type: string
        default: 'v24.10.6'

env:
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出编译工程
        uses: actions/checkout@v4

      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget curl ccache jq \
            qemu-utils squashfs-tools autoconf automake libtool pkg-config \
            libelf-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev \
            liblzma-dev libzstd-dev xz-utils cpio bzip2 subversion patch gperf \
            help2man intltool bc genisoimage
          echo "== 磁盘 =="; df -h /
          echo "== CPU/内存 =="; nproc; free -h

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth=1 --single-branch -b "${{ inputs.source_ref }}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git log -1 --format='底包 commit: %H%n日期: %ci%n说明: %s'
          echo "内核版本: $(grep KERNEL_PATCHVER target/linux/x86/Makefile)"

      - name: DIY part1 - feeds / LAN IP / Turbo ACC / Clash 内核
        env:
          LAN_IP: ${{ inputs.lan_ip }}
          ENABLE_QUICKSTART: ${{ inputs.enable_quickstart }}
          TURBOACC_MODE: ${{ inputs.turboacc_mode }}
          PREBUILT_CLASH_CORE: ${{ inputs.prebuilt_clash_core }}
          ROOTFS_PARTSIZE_MIB: ${{ inputs.rootfs_partsize_mib }}
        run: bash "$GITHUB_WORKSPACE/scripts/diy-part1.sh" "$GITHUB_WORKSPACE/openwrt"

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY part2 - 生成 .config 并执行编译前冲突预检
        id: preflight
        env:
          ENABLE_QUICKSTART: ${{ inputs.enable_quickstart }}
          TURBOACC_MODE: ${{ inputs.turboacc_mode }}
          ROOTFS_PARTSIZE_MIB: ${{ inputs.rootfs_partsize_mib }}
          LAN_IP: ${{ inputs.lan_ip }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/diy-part2.sh" \
            "$GITHUB_WORKSPACE/openwrt" \
            "$GITHUB_WORKSPACE/config/seed.config"

      - name: 上传编译前预检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report-run${{ github.run_number }}
          path: openwrt/PREFLIGHT_REPORT.txt
          if-no-files-found: warn
          retention-days: 30

      - name: 下载源码包
        if: ${{ inputs.preflight_only == false }}
        run: |
          cd openwrt
          make download -j8 V=s || { echo "首次下载失败，重试一次"; make download -j8 V=s; }

      - name: 编译固件
        if: ${{ inputs.preflight_only == false }}
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log
        # 失败时把日志尾部打出来，便于定位是哪个包炸了
      - name: 失败日志摘要
        if: ${{ failure() && inputs.preflight_only == false }}
        run: |
          echo "== build.log 末尾 300 行 =="
          tail -n 300 /tmp/build.log || true
          echo "== 磁盘 =="
          df -h / || true

      - name: 整理产物
        if: ${{ inputs.preflight_only == false }}
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TURBOACC_MODE: ${{ inputs.turboacc_mode }}
          ENABLE_QUICKSTART: ${{ inputs.enable_quickstart }}
          ROOTFS_PARTSIZE_MIB: ${{ inputs.rootfs_partsize_mib }}
          LAN_IP: ${{ inputs.lan_ip }}
        run: bash "$GITHUB_WORKSPACE/scripts/post-build.sh" "$GITHUB_WORKSPACE/openwrt"

      - name: 上传固件产物
        if: ${{ inputs.preflight_only == false }}
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-x86_64-run${{ github.run_number }}
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.qcow2
            openwrt/bin/targets/x86/64/SHA256SUMS
            openwrt/bin/targets/x86/64/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
